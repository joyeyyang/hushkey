[package]
name = "offline_voice_core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Offline AI voice assistant core engine (C ABI)"
build = "build.rs"

[lib]
name = "offline_voice_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
libc = "0.2"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
